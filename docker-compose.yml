services:
#######################
# Cloudflare Tunnel
#######################
  cloudflare-ai:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-ai
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - mcp-frontend

#######################
# AuthMCP Gateway
#######################
  authmcp-gateway-ai:
    build:
      context: ./authmcp-gateway/
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: authmcp-gateway-ai
    env_file:
      - ./authmcp-gateway/.env
    volumes:
      - ./data/authmcp-gateway/data:/app/data
      - ./authmcp-gateway/templates:/app/templates
      - ./authmcp-gateway/src:/app/src
    networks:
      - mcp-frontend
      - mcp-backend  
    restart: unless-stopped
        
#######################
# Basic Memory
#######################
  basic-memory-ai:
    image: ghcr.io/basicmachines-co/basic-memory:latest
    container_name: basic-memory-ai
    # Volume mounts for knowledge directories and persistent data
    volumes:
      # Persistent storage for configuration and database
      - ./data/basic-memory/config:/home/appuser/.basic-memory:rw
      # Mount your knowledge directory (required)
      # Change './knowledge' to your actual Obsidian vault or knowledge directory
      - ./data/basic-memory/knowledge:/app/data:rw
    environment:
      # Project configuration
      - BASIC_MEMORY_DEFAULT_PROJECT=main
      - BASIC_MEMORY_SYNC_CHANGES=true
      # Logging configuration
      - BASIC_MEMORY_LOG_LEVEL=INFO
      # Sync delay in milliseconds (adjust for performance vs responsiveness)
      - BASIC_MEMORY_SYNC_DELAY=1000
    # IMPORTANT: The SSE and streamable-http endpoints are not secured
    command: ["basic-memory", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    # Health monitoring
    healthcheck:
      test: ["CMD", "basic-memory", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mcp-backend

#######################
# MCP Memory Service
#######################
  mcp-memory-service-ai:
    image: ghcr.io/doobidoo/mcp-memory-service:latest
    environment:
      - MCP_STREAMABLE_HTTP_MODE=1
      - MCP_SSE_HOST=0.0.0.0
      - MCP_SSE_PORT=8765
      - MCP_OAUTH_ENABLED=true
      - MCP_API_KEY=${MCP_API_KEY}
      - MCP_OAUTH_SECRET_KEY=${MCP_OAUTH_SECRET_KEY}
      - MCP_OAUTH_STORAGE_BACKEND=sqlite
      - MCP_OAUTH_SQLITE_PATH=/app/data/oauth.db
      - MCP_MEMORY_STORAGE_BACKEND=sqlite_vec
      - MCP_MEMORY_SQLITE_PATH=/app/sqlite_db/memory.db
    volumes:
      - ./data/mcp-memory-service/data:/app/data
      - ./data/mcp-memory-service/sqlite:/app/sqlite_db
      - ./data/mcp-memory-service/backup:/app/backups
    networks:
      - mcp-backend
    restart: unless-stopped

  mcp-memory-service-dashboard:
    image: ghcr.io/doobidoo/mcp-memory-service:latest
    environment:
      - MCP_MODE=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8000
      - MCP_MEMORY_STORAGE_BACKEND=sqlite_vec
      - MCP_MEMORY_SQLITE_PATH=/app/sqlite_db/memory.db
      - MCP_API_KEY=${MCP_API_KEY}
    volumes:
      - ./data/mcp-memory-service/data:/app/data
      - ./data/mcp-memory-service/sqlite:/app/sqlite_db
      - ./data/mcp-memory-service/backup:/app/backups
    networks:
      - mcp-frontend
      - mcp-backend
    restart: unless-stopped

networks:
  mcp-backend:
    driver: bridge
  mcp-frontend:
    driver: bridge
